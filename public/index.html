<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turnera MVP</title><style>
:root{--ink:#12251a;--lime:#b9f23d;--paper:#f5f7f3;--line:#dfe7e0;--muted:#65746b;--red:#b44c40;--green:#29713e}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px system-ui,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.top{background:var(--ink);color:#fff}.bar{height:68px;max-width:1050px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900}.brand i{display:inline-grid;place-items:center;background:var(--lime);color:var(--ink);width:29px;height:29px;border-radius:8px;font-style:normal;margin-right:7px}.bar button{padding:8px 11px;border-radius:8px;background:#2c4537;color:#fff;font-size:12px;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.hero{margin:12px 0 26px}.hero h1{font-size:clamp(28px,5vw,45px);letter-spacing:-1.8px;margin:0}.hero p{color:var(--muted);font-size:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 9px 28px #17332608}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.login{max-width:730px;margin:0 auto}.login h2,.card h2{margin:0 0 8px;font-size:20px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.field{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:11px 0}.field input,.field select{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #d7e1d8;border-radius:9px;color:var(--ink)}.primary{width:100%;padding:12px;background:var(--lime);border-radius:10px;color:var(--ink);font-weight:900}.ghost{background:#eff4ef!important;color:#285d39!important}.danger{background:#fff0ed!important;color:var(--red)!important}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{padding:9px 11px;background:#eaf0eb;color:#526258;border-radius:9px;font-size:13px;font-weight:800}.tabs button.on{background:var(--ink);color:#fff}.notice{padding:12px 14px;border-radius:10px;background:#edf8e9;color:#28683c;font-size:13px;margin:12px 0}.error{background:#fff0ed;color:var(--red)}.court{border-top:1px solid var(--line);padding:13px 0}.court:first-child{border-top:0}.court h3{margin:0 0 8px;font-size:15px}.slots{display:flex;flex-wrap:wrap;gap:7px}.slot{padding:8px 10px;border-radius:8px;background:#edf6eb;color:#2a683e;font-size:12px;font-weight:800}.slot.busy{background:#fee8e4;color:#a2463c;cursor:not-allowed}.reservation{border-top:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.reservation b{display:block}.reservation small{color:var(--muted)}.badge{padding:6px 8px;background:#fff1da;color:#9a6515;border-radius:99px;font-size:11px;font-weight:800;height:max-content}.badge.paid{background:#e7f6df;color:#29683d}.hidden{display:none!important}.modal{display:none;position:fixed;inset:0;z-index:5;background:#10261bd6;place-items:center;padding:18px;overflow-y:auto}.modal.show{display:grid}.dialog{position:relative;width:min(460px,100%);max-height:calc(100vh - 36px);overflow-y:auto;background:#fff;border-radius:18px;padding:26px}.dialog h2{margin:0;font-size:21px;line-height:1.2;padding-right:34px}.close{position:absolute;right:18px;top:18px;background:#eef2ee;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1}.booking-summary{margin:14px 0 16px;padding:13px 14px;border-radius:11px;background:#f3f7f2}.booking-summary b{display:block;font-size:15px}.booking-summary span{display:block;margin-top:4px;color:var(--muted);font-size:13px}.payment-title{margin:0 0 8px;font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--muted)}.pay{display:block;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;margin:9px 0;cursor:pointer;line-height:1.35}.pay input{width:auto;margin:0 8px 0 0;vertical-align:middle;accent-color:#4b812d}.pay b{font-size:14px}.pay small{display:block;padding-left:24px;margin-top:3px;color:var(--muted);font-size:12px}.pay:has(input:checked){border-color:#8dbb70;background:#f5fff0;box-shadow:0 0 0 2px #b9f23d33}.dialog .primary{margin-top:10px}.dialog .primary:disabled{opacity:.62;cursor:wait}.payment-error{display:none;margin:11px 0 0;padding:10px 11px;border-radius:9px;background:#fff0ed;color:var(--red);font-size:12px;font-weight:700;line-height:1.4}.payment-error.show{display:block}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stat{background:#f6f9f5;border-radius:11px;padding:13px}.stat small{display:block;color:var(--muted);font-size:11px;font-weight:800}.stat b{font-size:23px}.credits{margin-top:10px;padding:12px;background:#eef8e9;border-radius:10px}.footer-note{margin-top:22px;color:var(--muted);font-size:12px}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}.wrap{padding:23px 14px}.bar{padding:0 14px}.dialog{padding:23px 18px;border-radius:15px}.modal{padding:12px}}
</style></head><body><header class="top"><div class="bar"><div class="brand"><i>T</i>turnera</div><div id="nav"></div></div></header><main class="wrap"><div id="app"></div></main><div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>
const $=s=>document.querySelector(s), app=$('#app'), modal=$('#modal'), modalBody=$('#modalBody');let me=null,selectedComplex=null,selectedDate=new Date().toISOString().slice(0,10),slots=[];
async function api(url,opt={}){const r=await fetch(url,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const data=await r.json();if(!r.ok)throw Error(data.error||'Ocurrió un error');return data}function money(n){return '$'+Number(n||0).toLocaleString('es-AR')}function toast(text,error=false){const el=document.createElement('div');el.className='notice '+(error?'error':'');el.textContent=text;app.prepend(el);setTimeout(()=>el.remove(),4500)}function closeModal(){modal.classList.remove('show')}function openModal(html){modalBody.innerHTML=html;modal.classList.add('show')}
async function boot(){const r=await api('/api/me');me=r.user;renderNav();if(!me)return loginScreen();return me.role==='owner'?ownerScreen():customerScreen()}function renderNav(){$('#nav').innerHTML=me?`<span style="font-size:12px;margin-right:9px">${me.name}</span><button onclick="logout()">Salir</button>`:''}async function logout(){await api('/api/auth/logout',{method:'POST'});boot()}
function loginScreen(){app.innerHTML=`<section class="hero login"><h1>Reservas reales, sin WhatsApp.</h1><p>Probá el MVP completo con datos de demostración o creá una cuenta.</p></section><section class="grid login"><div class="card"><h2>Ingresar</h2><p class="muted">Dueño demo: dueno@turnera.local · turnera123<br>Cliente demo: cliente@turnera.local · turnera123</p><form id="loginForm"><label class="field">EMAIL<input name="email" type="email" required></label><label class="field">CONTRASEÑA<input name="password" type="password" required></label><button class="primary">Entrar</button></form></div><div class="card"><h2>Crear cuenta</h2><form id="registerForm"><label class="field">NOMBRE<input name="name" required></label><label class="field">EMAIL<input name="email" type="email" required></label><label class="field">CONTRASEÑA<input name="password" type="password" minlength="8" required></label><label class="field">SOY<select name="role"><option value="customer">Cliente</option><option value="owner">Dueño de complejo</option></select></label><label class="field">NOMBRE DEL COMPLEJO (si aplica)<input name="complex_name"></label><button class="primary">Crear cuenta</button></form></div></section>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(x){toast(x.message,true)}};$('#registerForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(x){toast(x.message,true)}}}
async function customerScreen(){const r=await api('/api/complexes');selectedComplex=selectedComplex||r.complexes[0]?.id;const complex=r.complexes.find(x=>x.id===selectedComplex);app.innerHTML=`<section class="hero"><h1>Reservá tu cancha.</h1><p>Elegí el complejo, el turno y cómo pagar. Tus créditos quedan asociados a tu cuenta.</p></section><div class="tabs"><button class="on" onclick="customerScreen()">Reservar</button><button onclick="myReservations()">Mis turnos</button><button onclick="myCredits()">Mis créditos</button></div><section class="card"><div class="row"><div><h2>${complex?.name||'Sin complejos'}</h2><p class="muted">${complex?`Reintegro total cancelando con más de ${complex.cancellation_hours} hs. Con ${complex.cancellation_hours} hs o menos: ${complex.late_cancel_mode==='credit'?'crédito a favor':'sin devolución'}.`:''}</p></div><label class="field">FECHA<input id="date" type="date" min="${new Date().toISOString().slice(0,10)}" value="${selectedDate}"></label></div><div id="courts"><p class="muted">Cargando disponibilidad…</p></div></section>`;$('#date').onchange=e=>{selectedDate=e.target.value;loadAvailability()};loadAvailability()}
async function loadAvailability(){const r=await api(`/api/availability?complex_id=${selectedComplex}&date=${selectedDate}`);const hours=[17,18,19,20,21,22,23];$('#courts').innerHTML=r.courts.map(c=>`<div class="court"><h3>${c.name} · ${c.sport==='padel'?'Pádel':'Fútbol 5'} · ${money(c.hourly_price)}</h3><div class="slots">${hours.map(h=>{const start=`${selectedDate}T${String(h).padStart(2,'0')}:00:00`;const busy=r.reservations.some(x=>x.court_id===c.id&&x.starts_at.startsWith(start)),past=new Date(`${start}-03:00`)<=new Date(),unavailable=busy||past;return `<button class="slot ${unavailable?'busy':''}" ${unavailable?'disabled':''} onclick="book('${c.id}','${start}',${c.hourly_price},${c.deposit_amount},'${c.name}')">${String(h).padStart(2,'0')}:00 ${busy?'Ocupado':past?'Ya pasó':'Reservar'}</button>`}).join('')}</div></div>`).join('')}
function book(courtId,startsAt,total,deposit,courtName){const when=new Date(startsAt).toLocaleString('es-AR',{dateStyle:'full',timeStyle:'short'});openModal(`<h2>Confirmá tu turno</h2><div class="booking-summary"><b>${courtName}</b><span>${when}</span></div><p class="payment-title">¿CÓMO QUERÉS PAGAR?</p><label class="pay"><input type="radio" name="pay" value="deposit" checked><b>Abonar la seña · ${money(deposit)}</b><small>Reservás ahora y el resto queda pendiente en el complejo.</small></label><label class="pay"><input type="radio" name="pay" value="full"><b>Pagar el turno completo · ${money(total)}</b><small>Tu turno queda completamente pagado.</small></label><label class="pay"><input type="checkbox" id="useCredit"><b>Usar mi crédito disponible</b><small>Si tenés saldo a favor, se descuenta automáticamente.</small></label><div class="payment-error" id="paymentError" role="alert"></div><button class="primary" id="paymentButton" onclick="confirmBooking('${courtId}','${startsAt}')">Continuar al pago</button><p class="muted" style="margin:12px 0 0">El horario se bloquea recién al iniciar el cobro.</p>`)}async function confirmBooking(courtId,startsAt){const button=$('#paymentButton'),errorBox=$('#paymentError');button.disabled=true;button.textContent='Preparando pago…';errorBox.classList.remove('show');try{const payment_kind=document.querySelector('input[name="pay"]:checked').value,use_credit=$('#useCredit').checked;const r=await api('/api/reservations',{method:'POST',body:JSON.stringify({court_id:courtId,starts_at:startsAt,payment_kind,use_credit})});if(r.payment.init_point){button.textContent='Abriendo Mercado Pago…';window.location.assign(r.payment.init_point);return}closeModal();toast(r.payment.reason||'Turno confirmado con crédito.');loadAvailability()}catch(x){button.disabled=false;button.textContent='Reintentar pago';errorBox.textContent=x.message;errorBox.classList.add('show')}}
async function myReservations(){const r=await api('/api/my/reservations');app.innerHTML=`<section class="hero"><h1>Mis turnos</h1><p>Cancelá y consultá el estado de cada reserva.</p></section><div class="tabs"><button onclick="customerScreen()">Reservar</button><button class="on">Mis turnos</button><button onclick="myCredits()">Mis créditos</button></div><section class="card">${r.reservations.length?r.reservations.map(x=>`<div class="reservation"><div><b>${x.complex_name} · ${x.court_name}</b><small>${new Date(x.starts_at).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'})} · ${x.status} · Pagado ${money(x.paid_amount)}</small></div>${x.status==='cancelled'?`<span class="badge">Cancelado: ${x.cancellation_outcome}</span>`:`<button class="danger" onclick="cancelReservation('${x.id}')">Cancelar</button>`}</div>`).join(''):'<p class="muted">Todavía no tenés reservas.</p>'}</section>`}async function cancelReservation(id){if(!confirm('¿Querés cancelar este turno?'))return;try{const r=await api(`/api/reservations/${id}/cancel`,{method:'POST'});toast(r.detail);myReservations()}catch(x){toast(x.message,true)}}
async function myCredits(){const r=await api('/api/my/credits');const total=r.credits.reduce((a,x)=>a+x.amount,0);app.innerHTML=`<section class="hero"><h1>Mis créditos</h1><p>Tu saldo está asociado a esta cuenta y se puede usar al reservar.</p></section><div class="tabs"><button onclick="customerScreen()">Reservar</button><button onclick="myReservations()">Mis turnos</button><button class="on">Mis créditos</button></div><section class="card"><div class="credits"><b>Saldo disponible: ${money(total)}</b></div>${r.credits.length?r.credits.map(x=>`<div class="reservation"><div><b>${x.complex_name}</b><small>${x.note||x.kind}</small></div><b>${x.amount>0?'+':''}${money(x.amount)}</b></div>`).join(''):'<p class="muted">Aún no tenés movimientos.</p>'}</section>`}
async function ownerScreen(){const r=await api('/api/owner/reservations');const c=r.complex;app.innerHTML=`<section class="hero"><h1>Panel del complejo</h1><p>${c.name} · administrá reservas, excepciones y política de cancelación.</p></section><section class="grid"><div class="card"><h2>Política de cancelación</h2><form id="policyForm"><label class="field">REINTEGRO TOTAL SI CANCELA CON MÁS DE (HS)<input name="cancellation_hours" type="number" min="0" value="${c.cancellation_hours}"></label><label class="field">CON ESE PLAZO O MENOS<select name="late_cancel_mode"><option value="none" ${c.late_cancel_mode==='none'?'selected':''}>Sin devolución</option><option value="credit" ${c.late_cancel_mode==='credit'?'selected':''}>Crédito a favor</option></select></label><button class="primary">Guardar política</button></form></div><div class="card"><h2>Agregar cancha</h2><form id="courtForm"><label class="field">NOMBRE<input name="name" required></label><label class="field">DEPORTE<select name="sport"><option value="padel">Pádel</option><option value="futbol">Fútbol 5</option></select></label><div class="grid"><label class="field">PRECIO<input name="hourly_price" type="number" required></label><label class="field">SEÑA<input name="deposit_amount" type="number" required></label></div><button class="primary">Agregar</button></form></div></section><section class="card" style="margin-top:17px"><h2>Reservas</h2>${r.reservations.length?r.reservations.map(x=>`<div class="reservation"><div><b>${x.customer_name} · ${x.court_name}</b><small>${new Date(x.starts_at).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'})} · ${x.email} · ${x.phone||'sin teléfono'}</small></div>${x.status==='cancelled'?`<span class="badge">Cancelado</span>`:`<span><button class="ghost" onclick="ownerCancel('${x.id}','refund')">Reintegrar</button> <button class="ghost" onclick="ownerCancel('${x.id}','credit')">Crédito</button> <button class="danger" onclick="ownerCancel('${x.id}','none')">Sin devolución</button></span>`}</div>`).join(''):'<p class="muted">Aún no hay reservas.</p>'}</section>`;$('#policyForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/owner/policy',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Política guardada')}catch(x){toast(x.message,true)}};$('#courtForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/owner/courts',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Cancha agregada');ownerScreen()}catch(x){toast(x.message,true)}}}async function ownerCancel(id,outcome){if(!confirm('¿Aplicar esta excepción?'))return;try{await api(`/api/owner/reservations/${id}/cancel`,{method:'POST',body:JSON.stringify({outcome})});toast('Excepción aplicada');ownerScreen()}catch(x){toast(x.message,true)}}boot();
</script></body></html>
